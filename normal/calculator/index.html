<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="cal.png" type="image/x-icon">
</head>
<body>
    <header class="header">
        <h1>CALCULATOR</h1>
    </header>

    <main class="main">
        <div class="container">
            <form id="calculator">
                <input type="text" id="display" readonly>
                <div class="buttons">
                    <button type="button" class="btn" aria-label="Clear" onclick="clearDisplay()">C</button>
                    <button type="button" class="btn" data-value="7">7</button>
                    <button type="button" class="btn" data-value="8">8</button>
                    <button type="button" class="btn" data-value="9">9</button>
                    <button type="button" class="btn operator" data-value="/">/</button>
                    
                    <button type="button" class="btn" data-value="4">4</button>
                    <button type="button" class="btn" data-value="5">5</button>
                    <button type="button" class="btn" data-value="6">6</button>
                    <button type="button" class="btn operator" data-value="*">*</button>
                    
                    <button type="button" class="btn" data-value="1">1</button>
                    <button type="button" class="btn" data-value="2">2</button>
                    <button type="button" class="btn" data-value="3">3</button>
                    <button type="button" class="btn operator" data-value="-">-</button>
                    
                    <button type="button" class="btn zero-btn" data-value="0">0</button>
                    <button type="submit" class="btn operator equal-btn">=</button>
                    <button type="button" class="btn operator plus-btn" data-value="+">+</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Calculator App</p>
    </footer>
    <script src="scricpt.js"></script>
</body>
</html>
