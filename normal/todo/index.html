<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <!-- Favicon -->
    <link rel="icon" href="to.png" type="image/x-icon">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>To-Do List</h1>
        <button id="addTaskButton">Add Task</button>
    </header>

    <!-- Main Content -->
    <main class="main">
        <section class="pending">
            <h2>Pending</h2>
            <ul id="pendingTasks"></ul>
        </section>

        <section class="completed">
            <h2>Completed</h2>
            <ul id="completedTasks"></ul>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 <strong>Ashutosh Bhatt</strong> — All rights reserved</p>
    </footer>

    <!-- Script -->
    <script src="scricpt.js"></script>
</body>

</html>
