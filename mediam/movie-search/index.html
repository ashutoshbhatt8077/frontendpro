<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Title -->
    <div class="title">
        <h1>SEARCH YOUR MOVIE</h1>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Search Box -->
        <div class="search">
            <form id="movieForm">
                <input type="text" id="movieName" class="movieInput" placeholder="Enter the movie..." required>
            </form>
        </div>
        <!-- Movies Display Section -->
        <div class="movies"></div>
    </div>

    <!-- Footer -->
    <footer>
        <p>THIS CONTENT IS COPYRIGHT TO <strong>ASHUTOSH</strong></p>
    </footer>
    <script src="js.js"></script>
</body>

</html>
